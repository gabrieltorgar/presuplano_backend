[project]
name = "itzaka-backend"
version = "7.0.0"
description = "Itzaka — cotizador multi-tenant para arquitectos (backend API)"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.2",
    "djangorestframework>=3.17.2,<3.19",
    "djangorestframework-simplejwt>=5.3,<6",
    "django-cors-headers>=4.4,<5",
    "django-environ>=0.11,<0.15",
    "django-filter>=24.3,<27",
    "psycopg[binary]>=3.2,<4",
    "pillow>=13,<14",
    "whitenoise>=6.7,<7",
    "django-storages[s3]>=1.14,<2",
    "boto3>=1.35,<2",
    "anthropic>=1,<2",
    "opencv-python-headless>=4.10,<6",
    "numpy>=2,<3",
    "filetype>=1.2.0",
    "django-csp>=4,<5",
    "django-unfold>=0.110,<0.111",
    "django-phonenumber-field[phonenumbers]>=8,<9",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-django>=4.9,<5",
    "pytest-cov>=5.0,<8",
    "pytest-mock>=3.14,<4",
    "factory-boy>=3.3,<4",
    "ruff>=0.6,<1",
]

[tool.vercel]
# Donde Vercel encuentra la instancia WSGI. Sin esto tendría que adivinarla, y
# el proyecto vive bajo src/, que no es donde importa.
entrypoint = "wsgi:application"

[tool.ruff]
line-length = 88
# Los scripts del gate (git-deploy-ops) se copian tal cual del flujo: ni lint ni formato.
extend-exclude = [
    "scripts/test_gate.py",
    "scripts/security_audit.py",
    "scripts/gate_guard.py",
    "scripts/readme_sync.py",
]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "S", "LOG", "G"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "common", "core", "api"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S107"]
"**/test_*.py" = ["S101", "S105", "S106", "S107"]
"**/migrations/**" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
pythonpath = ["src"]
python_files = ["test_*.py", "tests.py"]
addopts = "--reuse-db"
testpaths = ["src"]
markers = [
    "no_cotas_mock: la lectura rápida de las cotas no se simula (se prueba la llamada real)",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "src/conftest.py",
    "src/core/settings*.py",
    "src/core/asgi.py",
    "src/core/wsgi.py",
    "src/manage.py",
]

[tool.coverage.report]
show_missing = false
skip_covered = true
